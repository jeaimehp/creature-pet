; Guition ESP32-4848S040 — ESP32-S3 N16R8, CH340 serial (not native USB).
; pioarduino ships Arduino 3 / ESP-IDF 5, which LovyanGFX needs for the RGB panel.
[env:guition-4848s040]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino

upload_port = /dev/tty.usbserial-12430
monitor_port = /dev/tty.usbserial-12430
upload_speed = 460800
monitor_speed = 115200

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=1

lib_deps =
    https://github.com/lovyan03/LovyanGFX.git
